<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 64" preserveAspectRatio="none" fill="currentColor" stroke="none">
  <!--
    Destruction-bar skyline. viewBox 0 0 400 64; the ground is y = 64; x runs with the bar:
    x = 400 * (fill fraction).

    Drawn to be STRETCHED into the game's bar, a box about 12 times wider than tall
    (560 x 46 px: 1.4 px per unit across, 0.72 px per unit up), which is why the root carries
    preserveAspectRatio="none" and why everything here looks twice too tall at 400 x 64.

    Three stepped towers stand at the three marks. Each is 24 units wide and ends on its mark,
    so it is the last thing to fall before the mark is passed:
      mark 1, 21%:  tower from x = 60 to 84,   spire x = 70.5 to 73.5, top y = 12
      mark 2, 57%:  tower from x = 204 to 228, spire x = 214.5 to 217.5, top y = 6
      mark 3, 100%: tower from x = 376 to 400, spire x = 386.5 to 389.5, top y = 2
    Every other roof stays between y = 40 and y = 56, so each tower stands more than twice as
    high as anything else in its stretch of the bar.

    To crumble it left to right, clip the class "sky-city" from the left
    (clip-path: inset(0 0 0 21%)). The class "sky-rubble" lies inside the city's outline
    (the city is never lower than y = 56), so it only shows where the city has been clipped
    away; give it the rubble color.

    The city path below is one building per line, left to right.
  -->
  <path class="sky-rubble" d="M0 64V59L5 56.5 9 60 14 57.5 20 59.5 27 56.5 33 59 38 57.5 45 59.5 52 56.5 58 59 66 56.5 72 60 79 57.5 84 59.5 92 56.5 99 59 106 56.5 113 60 121 57.5 127 59.5 135 56.5 142 59 150 56.5 157 60 164 57.5 171 59.5 178 56.5 185 59 193 56.5 200 60 207 57.5 214 59.5 221 56.5 228 59 236 57.5 243 59.5 250 56.5 258 59 265 57.5 272 60 279 56.5 286 59 294 56.5 301 60 308 57.5 315 59.5 322 56.5 329 59 337 56.5 344 60 351 57.5 358 59.5 365 56.5 372 59 380 56.5 387 60 394 57.5 400 59V64Z"/>
