  <!--
    Destruction-bar skyline. viewBox 0 0 400 64; the ground is y = 64; x runs with the bar:
    x = 400 * (fill fraction). Three towers stand at the three marks. Each tower ends on its
    mark, so it is the last thing to fall before the mark is passed:
      mark 1, 21%:  tower from x = 68 to 84,   spire at x = 76
      mark 2, 57%:  tower from x = 212 to 228, spire at x = 220
      mark 3, 100%: tower from x = 384 to 400, spire at x = 392
    To crumble it left to right, clip or mask the class "sky-city" from the left
    (for example clip-path: inset(0 0 0 21%)). The class "sky-rubble" lies inside the city's
    outline, so it only shows where the city has been clipped away; give it the rubble color.
  -->
